site_name: Universal Honeypot Benchmarking Standard (UHBS)
site_description: A personal open-source draft framework for vendor-neutral honeypot and deception evaluation (UHQS 0–100).
site_url: https://mziqudhd92.github.io/uhbs-standard/
repo_url: https://github.com/mziqudhd92/uhbs-standard
repo_name: mziqudhd92/uhbs-standard
edit_uri: edit/main/docs/
copyright: UHBS v4.0 — personal draft evaluation framework (Apache-2.0)

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Specification:
      - Status of This Document: specification/status.md
      - Core Principles: specification/core-principles.md
      - Modules A–F: specification/modules.md
      - Scoring Formula: specification/scoring-formula.md
      - Target Profiles (TPS): specification/target-profiles.md
  - Reference Implementation: reference-implementation.md
  - Conformance:
      - Overview: conformance/index.md
  - Mappings:
      - Index: mappings/index.md
      - ATT&CK: mappings/attack.md
      - NIST: mappings/nist.md
      - IEC 62443: mappings/iec-62443.md
  - Registry: registry.md
  - Tooling:
      - CLI & Validator: tooling/cli.md
  - Scorecards:
      - Official Examples: scorecards/index.md
      - Illustrative POSIX / GenAI: scorecards/illustrative-posix-genai.md
  - Governance:
      - RFCs: rfcs/README.md
      - RFC-0001 Baseline: rfcs/0001-uhbs-4.0-baseline.md
      - RFC Template: rfcs/0000-template.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mziqudhd92/uhbs-standard
