site_name: Universal Honeypot Benchmarking Standard (UHBS)
site_description: Objective, repeatable, quantitative benchmarking for honeypots and deception technology.
site_url: https://mziqudhd92.github.io/uhbs-standard/
repo_url: https://github.com/mziqudhd92/uhbs-standard
repo_name: mziqudhd92/uhbs-standard
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 UHBS Project Contributors — Apache License 2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Specification:
      - Core Principles: specification/core-principles.md
      - Modules A–F: specification/modules.md
      - Scoring Formula: specification/scoring-formula.md
      - Target Profiles (TPS): specification/target-profiles.md
  - Tooling:
      - CLI & Validator: tooling/cli.md
  - Scorecards:
      - Official Examples: scorecards/index.md
      - CyberHalluciNet Example: scorecards/cyberhallucinet.md
  - Governance:
      - RFCs: rfcs/README.md
      - RFC Template: rfcs/0000-template.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mziqudhd92/uhbs-standard
