target_metadata:
  name: "Low-Interaction-Emulator"
  class: "Low-Interaction"
  # Class-only TPS: no protocol list. Bind listeners via --protocol / inventory.
  # For SSH/Telnet decoys use low_interaction_ssh.yaml instead.

performance_baseline:
  expected_p95_latency_ms: 100
  strict_rfc_enforcement: true
  timing_samples: 30

safety_boundary:
  allowed_outbound_traffic: false
  allow_local_code_execution: false
