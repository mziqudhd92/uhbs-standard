target_metadata:
  name: "Low-Interaction-SSH-Telnet-Emulator"
  class: "Low-Interaction"
  protocol: "ssh"
  protocols: ["ssh", "telnet"]

performance_baseline:
  # Shell-emulator SSH is multi-second under load; 100ms silently fails Module E.
  expected_p95_latency_ms: 3000
  strict_rfc_enforcement: true
  timing_samples: 30
  # Optional: set gold_baseline_host to a native sshd for KS/HASSH compare.

safety_boundary:
  allowed_outbound_traffic: false
  allow_local_code_execution: false
