[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhbs"
version = "4.0.0"
description = "Universal Honeypot Benchmarking Standard (UHBS) CLI and validators"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "UHBS Project Contributors" }]
keywords = ["honeypot", "benchmarking", "cybersecurity", "deception", "uhbs"]
dependencies = [
  "jsonschema>=4.22",
  "PyYAML>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
uhbs = "uhbs_cli.cli:main"

[project.urls]
Homepage = "https://github.com/mziqudhd92/uhbs-standard"
Documentation = "https://mziqudhd92.github.io/uhbs-standard/"
Repository = "https://github.com/mziqudhd92/uhbs-standard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uhbs_cli = ["../../schemas/*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
