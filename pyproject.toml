[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhbs"
version = "4.0.0"
description = "Universal Honeypot Benchmarking Standard (UHBS) — validators and UHBS-Lab reference core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Moran Zavdi" }]
keywords = ["honeypot", "benchmarking", "cybersecurity", "deception", "uhbs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema>=4.22",
  "PyYAML>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
lab = [
  "paramiko>=3.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "paramiko>=3.0",
]

[project.scripts]
uhbs = "uhbs_cli.cli:main"
uhbs-lab = "uhbs_core.run_benchmark:main"
uhbs-uhqs = "uhbs_core.calculate_uhqs_v4:main"

[project.urls]
Homepage = "https://github.com/mziqudhd92/uhbs-standard"
Documentation = "https://mziqudhd92.github.io/uhbs-standard/"
Repository = "https://github.com/mziqudhd92/uhbs-standard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uhbs_core = [
  "profiles/tps/*.yaml",
  "profiles/*.yaml",
  "profiles/coverage/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Module A–F scripts retain lab-harness style; lint shared/core surfaces tightly.
extend-exclude = [
  "src/uhbs_core/test_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Lab harness protocol plugins retain long probe detail strings / socket patterns.
"src/uhbs_core/protocols/**/*.py" = ["E501", "SIM105"]
"src/uhbs_core/sandbox_preflight.py" = ["E402", "E501"]
"src/uhbs_core/test_*.py" = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
