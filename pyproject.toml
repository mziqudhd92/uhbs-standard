[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhbs"
version = "4.0.0"
description = "Universal Honeypot Benchmarking Standard (UHBS) — validators and UHBS-Lab reference core"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "UHBS Project Stewards" }]
keywords = ["honeypot", "benchmarking", "cybersecurity", "deception", "uhbs"]
dependencies = [
  "jsonschema>=4.22",
  "PyYAML>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
lab = [
  "paramiko>=3.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "paramiko>=3.0",
]

[project.scripts]
uhbs = "uhbs_cli.cli:main"
uhbs-lab = "uhbs_core.run_benchmark:main"
uhbs-uhqs = "uhbs_core.calculate_uhqs_v4:main"

[project.urls]
Homepage = "https://github.com/mziqudhd92/uhbs-standard"
Documentation = "https://mziqudhd92.github.io/uhbs-standard/"
Repository = "https://github.com/mziqudhd92/uhbs-standard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uhbs_core = [
  "profiles/tps/*.yaml",
  "profiles/*.yaml",
  "profiles/coverage/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/uhbs_core/test_*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
