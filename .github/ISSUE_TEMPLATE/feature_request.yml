name: Feature Request
description: Propose a non-normative enhancement or tooling improvement
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For **normative** specification changes (modules, UHQS, Safety Gate, TPS), open an RFC per [GOVERNANCE.md](../GOVERNANCE.md) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
