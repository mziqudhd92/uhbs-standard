name: CI Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,lab]"
          pip install check-jsonschema

      - name: Lint
        run: |
          ruff check src/uhbs_cli src/uhbs_core/uhqs_math.py src/uhbs_core/models.py \
            src/uhbs_core/run_benchmark.py src/uhbs_core/hqs.py src/uhbs_core/manifest.py \
            src/uhbs_core/tps.py src/uhbs_core/report.py src/uhbs_core/inventory.py \
            src/uhbs_core/source_scan.py src/uhbs_core/ssh_session.py \
            src/uhbs_core/sandbox_preflight.py src/uhbs_core/calculate_uhqs_v4.py \
            src/uhbs_core/protocols tests

      - name: Unit tests
        run: pytest -q

      - name: Validate JSON schemas (meta)
        run: |
          check-jsonschema --check-metaschema schemas/profile.schema.json
          check-jsonschema --check-metaschema schemas/scorecard.schema.json

      - name: Validate example profile and scorecard
        run: |
          uhbs validate-profile templates/profile.yaml
          uhbs validate-profile templates/profiles/low-interaction.yaml
          uhbs validate-profile templates/profiles/ics-scada.yaml
          uhbs validate-scorecard docs/scorecards/examples/illustrative-posix-genai.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/cowrie-low-interaction.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/posix-shell-lab.scorecard.json
          uhbs validate-scorecard docs/conformance/fixtures/safety-gate-fail.scorecard.json
          check-jsonschema --check-metaschema schemas/evidence-pack.schema.json
