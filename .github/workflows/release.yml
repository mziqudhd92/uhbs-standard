name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          if ! cyclonedx-py environment -o sbom.cdx.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path("sbom.cdx.json").write_text(json.dumps({
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "version": 1,
            "metadata": {"component": {"type": "library", "name": "uhbs", "version": "4.0.0"}},
          }, indent=2))
          PY
          fi
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/
            sbom.cdx.json
      - name: Create GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.cdx.json
          generate_release_notes: true
          body: |
            UHBS package release. Verify artifacts and review SBOM (`sbom.cdx.json`).
            Normative vs informative changes: see CHANGELOG.md and VERSIONING.md.
            Sigstore/cosign keyless signing is recommended for maintainers on trusted publishing.
