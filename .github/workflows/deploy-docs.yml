name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build landing site (UHBS-Web)
        working-directory: web
        run: |
          npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build specification docs (MkDocs)
        run: |
          pip install mkdocs-material
          mkdocs build --strict --site-dir web/dist/specification

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
