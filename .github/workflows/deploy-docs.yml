name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build landing site (UHBS hub)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build specification docs (MkDocs → /mkdocs)
        run: |
          pip install mkdocs-material
          mkdocs build --strict --site-dir web/dist/mkdocs

      - name: Publish root discovery files
        run: |
          cp llms.txt web/dist/llms.txt
          printf '%s\n' \
            '# https://mziqudhd92.github.io/uhbs-standard/robots.txt' \
            'User-agent: *' \
            'Allow: /' \
            '' \
            'Sitemap: https://mziqudhd92.github.io/uhbs-standard/mkdocs/sitemap.xml' \
            'Host: https://mziqudhd92.github.io/uhbs-standard/' \
            > web/dist/robots.txt

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./web/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
