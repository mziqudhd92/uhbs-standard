name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build landing site (UHBS hub)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build specification docs (MkDocs → /mkdocs)
        run: |
          pip install mkdocs-material
          mkdocs build --strict --site-dir web/dist/mkdocs

      - name: Publish root discovery files
        run: |
          # AEO / GEO / SEO entrypoints advertised by AGENTS.md and humans.txt
          cp llms.txt web/dist/llms.txt
          cp docs/llms-full.txt web/dist/llms-full.txt
          cp docs/humans.txt web/dist/humans.txt
          cp server.json web/dist/server.json
          mkdir -p web/dist/.well-known
          cp docs/.well-known/security.txt web/dist/.well-known/security.txt
          printf '%s\n' \
            '# https://mziqudhd92.github.io/uhbs-standard/robots.txt' \
            'User-agent: *' \
            'Allow: /' \
            '' \
            '# AEO: llms.txt · llms-full.txt · humans.txt · server.json (MCP) · mkdocs/' \
            '# Prefer https://mziqudhd92.github.io/uhbs-standard/llms.txt for agents' \
            'Sitemap: https://mziqudhd92.github.io/uhbs-standard/mkdocs/sitemap.xml' \
            'Host: https://mziqudhd92.github.io/uhbs-standard/' \
            > web/dist/robots.txt

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./web/dist

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
