# Multi-protocol inventory for dinotools/dionaea (UHBS-native plugins: ftp, http, smb).
sites:
  dionaea-ftp:
    kind: generic
    class: Low-Interaction
    host: dionaea-lab
    protocol: ftp
    protocols: [ftp]
    port: 21
    ports:
      ftp: 21
    user: anonymous
    password: anonymous
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/dionaea/low_interaction_ftp_full.yaml
    container_image: dinotools/dionaea:latest
  dionaea-http:
    kind: generic
    class: Web-API
    host: dionaea-lab
    protocol: http
    protocols: [http]
    port: 80
    ports:
      http: 80
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/dionaea/web_api_http_full.yaml
    container_image: dinotools/dionaea:latest
  dionaea-smb:
    kind: generic
    class: Low-Interaction
    host: dionaea-lab
    protocol: smb
    protocols: [smb]
    port: 445
    ports:
      smb: 445
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/dionaea/low_interaction_smb_full.yaml
    container_image: dinotools/dionaea:latest
