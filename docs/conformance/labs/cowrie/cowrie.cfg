# UHBS lab overlay for cowrie/cowrie — enable Telnet alongside SSH.
# Official defaults: SSH :2222 (SFTP subsystem on), Telnet disabled.
# Docs: https://docs.cowrie.org/ · INSTALL.rst Telnet section · [ssh] sftp_enabled

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = true

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0
