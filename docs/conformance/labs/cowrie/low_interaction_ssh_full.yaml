# Formal Low-Interaction SSH TPS (lab proof target — class/protocol scoped).
target_metadata:
  name: "Low-Interaction-SSH-Telnet-Emulator"
  class: "Low-Interaction"
  protocol: "ssh"
  protocols: ["ssh"]

performance_baseline:
  # Realistic for medium-interaction SSH emulators (handshake + fake FS).
  expected_p95_latency_ms: 3000
  strict_rfc_enforcement: true
  timing_samples: 1000
  # Optional native peer for KS/HASSH (vendor-agnostic when set by the lab):
  # gold_baseline_host: openssh-baseline
  # gold_baseline_port: 22
  # gold_baseline_protocols: [ssh]

safety_boundary:
  allowed_outbound_traffic: false
  allow_local_code_execution: false
