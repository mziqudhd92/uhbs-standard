# Inventory for cowrie/cowrie detailed UHBS Docker lab (SSH primary).
# Inside uhbs-lab, Cowrie listens on container port 2222.
# Mounts: source → /honeypot, logs → /telemetry
# Default docker image accepts root/admin (not root/root).
sites:
  cowrie:
    kind: ssh
    class: Low-Interaction
    host: cowrie-lab
    protocol: ssh
    protocols: [ssh]
    port: 2222
    ports:
      ssh: 2222
    user: root
    password: admin
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/cowrie/low_interaction_ssh_full.yaml
    container_image: cowrie/cowrie:latest
