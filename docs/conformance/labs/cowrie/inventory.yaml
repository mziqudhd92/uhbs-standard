# Multi-protocol inventory for cowrie/cowrie (UHBS-native: ssh + telnet).
# SFTP is an SSH subsystem (sftp_enabled) — graded under SSH, not a separate TCP plugin.
sites:
  cowrie-ssh:
    kind: ssh
    class: Low-Interaction
    host: cowrie-lab
    protocol: ssh
    protocols: [ssh]
    port: 2222
    ports:
      ssh: 2222
    user: root
    password: admin
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/cowrie/low_interaction_ssh_full.yaml
    container_image: cowrie/cowrie:latest
  cowrie-telnet:
    kind: generic
    class: Low-Interaction
    host: cowrie-lab
    protocol: telnet
    protocols: [telnet]
    port: 2223
    ports:
      telnet: 2223
    user: root
    password: admin
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/cowrie/low_interaction_telnet_full.yaml
    container_image: cowrie/cowrie:latest
