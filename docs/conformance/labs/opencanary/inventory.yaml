# Multi-protocol inventory for thinkst/opencanary (UHBS-native plugins).
# SMB requires Samba and is not graded in this Docker lab.
# Config: opencanary.conf
sites:
  opencanary-http:
    kind: generic
    class: Web-API
    host: opencanary-lab
    protocol: http
    protocols: [http]
    port: 80
    ports: {http: 80}
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/opencanary/web_api_http_full.yaml
    container_image: thinkst/opencanary:latest
  opencanary-ftp:
    kind: generic
    class: Low-Interaction
    host: opencanary-lab
    protocol: ftp
    protocols: [ftp]
    port: 21
    ports: {ftp: 21}
    user: anonymous
    password: anonymous
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/opencanary/low_interaction_ftp_full.yaml
    container_image: thinkst/opencanary:latest
  opencanary-ssh:
    kind: ssh
    class: Low-Interaction
    host: opencanary-lab
    protocol: ssh
    protocols: [ssh]
    port: 2222
    ports: {ssh: 2222}
    user: root
    password: root
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/opencanary/low_interaction_ssh_full.yaml
    container_image: thinkst/opencanary:latest
  opencanary-telnet:
    kind: generic
    class: Low-Interaction
    host: opencanary-lab
    protocol: telnet
    protocols: [telnet]
    port: 23
    ports: {telnet: 23}
    user: admin
    password: admin1
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/opencanary/low_interaction_telnet_full.yaml
    container_image: thinkst/opencanary:latest
  opencanary-redis:
    kind: generic
    class: Low-Interaction
    host: opencanary-lab
    protocol: redis
    protocols: [redis]
    port: 6379
    ports: {redis: 6379}
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/opencanary/low_interaction_redis_full.yaml
    container_image: thinkst/opencanary:latest
