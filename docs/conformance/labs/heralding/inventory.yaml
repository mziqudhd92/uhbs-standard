sites:
  heralding-ssh:
    kind: ssh
    class: Low-Interaction
    host: heralding-lab
    protocol: ssh
    protocols: [ssh]
    port: 22
    ports: {ssh: 22}
    user: root
    password: "admin"
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/heralding/low_interaction_ssh_full.yaml
    container_image: heralding:uhbs-lab
  heralding-ftp:
    kind: generic
    class: Low-Interaction
    host: heralding-lab
    protocol: ftp
    protocols: [ftp]
    port: 21
    ports: {ftp: 21}
    user: anonymous
    password: ""
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/heralding/low_interaction_ftp_full.yaml
    container_image: heralding:uhbs-lab
  heralding-smtp:
    kind: generic
    class: Low-Interaction
    host: heralding-smtp-lab
    protocol: smtp
    protocols: [smtp]
    port: 25
    ports: {smtp: 25}
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/heralding/low_interaction_smtp_full.yaml
    container_image: heralding:uhbs-lab
