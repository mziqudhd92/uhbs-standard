# mrwadams/honeyagents — Cowrie honeypot component (stock cowrie/cowrie).
# Compose also publishes :2223 but stock Cowrie defaults leave Telnet disabled.
# nginx/Apache are the protected web app — not graded as honeypot decoys.
sites:
  honeyagents-ssh:
    kind: ssh
    class: Low-Interaction
    host: honeyagents-honeypot
    protocol: ssh
    protocols: [ssh]
    port: 2222
    ports:
      ssh: 2222
    user: root
    password: "admin"
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/honeyagents/low_interaction_ssh_full.yaml
    container_image: cowrie/cowrie:latest
