# Thales DataTrap (dd-honeypot) — UHBS-native protocol overlap.
sites:
  datatrap-ssh:
    kind: ssh
    class: Low-Interaction
    host: datatrap-lab
    protocol: ssh
    protocols: [ssh]
    port: 2222
    ports: {ssh: 2222}
    user: root
    password: admin
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/datatrap/low_interaction_ssh_full.yaml
    container_image: datatrap:uhbs-lab
  datatrap-http:
    kind: generic
    class: Web-API
    host: datatrap-lab
    protocol: http
    protocols: [http]
    port: 8080
    ports: {http: 8080}
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/datatrap/web_api_http_full.yaml
    container_image: datatrap:uhbs-lab
  datatrap-mysql:
