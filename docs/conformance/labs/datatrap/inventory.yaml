    host: datatrap-lab
    protocol: redis
    protocols: [redis]
    port: 6379
    ports: {redis: 6379}
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/datatrap/low_interaction_redis_full.yaml
    container_image: datatrap:uhbs-lab
  datatrap-telnet:
    kind: generic
    class: Low-Interaction
    host: datatrap-lab
    protocol: telnet
    protocols: [telnet]
    port: 2323
    ports: {telnet: 2323}
    user: admin
    password: admin
    source_root: /honeypot
    telemetry_dir: /telemetry
    tps: /work/docs/conformance/labs/datatrap/low_interaction_telnet_full.yaml
    container_image: datatrap:uhbs-lab
  datatrap-postgres:
    kind: generic
    class: Low-Interaction
    host: datatrap-lab
    protocol: postgres
