# Formal Low-Interaction TPS for Endlessh (SSH tarpit) deep UHBS-Lab grading.
# Protocol id "ssh_tarpit" → generic TCP plugin. Never use protocol=ssh here.
target_metadata:
  name: "Low-Interaction-SSH-Tarpit"
  class: "Low-Interaction"
  protocol: "ssh_tarpit"
  protocols: ["ssh_tarpit"]

performance_baseline:
  expected_p95_latency_ms: 150
  strict_rfc_enforcement: true
  timing_samples: 1000

safety_boundary:
  allowed_outbound_traffic: false
  allow_local_code_execution: false
